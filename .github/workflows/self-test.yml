name: hardware-ci self-test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/manufacturing.yml"
      - ".github/workflows/fpga.yml"
      - ".github/workflows/hdl.yml"
      - ".github/workflows/hdl.yml"
      - ".github/workflows/self-test.yml"
      - "test/fixture/**"
      - "test/fpga/**"
      - "test/fpga-ecp5/**"
      - "test/hdl/**"
      - "test/hdl/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/manufacturing.yml"
      - ".github/workflows/fpga.yml"
      - ".github/workflows/self-test.yml"
      - "test/fixture/**"
      - "test/fpga/**"
      - "test/fpga-ecp5/**"

permissions:
  contents: write

jobs:
  fixture:
    uses: Ploos-AS/hardware-ci/.github/workflows/manufacturing.yml@main
    with:
      board_path: test/fixture/fixture.kicad_pcb
      publish_release: false

  fpga-fixture:
    uses: ./.github/workflows/fpga.yml
    with:
      board: upduino-v3.1
      working_directory: test/fpga
      test_target: test
      build_target: build
      bitstream_path: test/fpga/fixture.bin

  ecp5-fixture:
    uses: ./.github/workflows/fpga.yml
    with:
      board: ecp5
      working_directory: test/fpga-ecp5
      test_target: test
      build_target: build
      bitstream_path: test/fpga-ecp5/fixture.bit

  hdl-fixture:
    uses: ./.github/workflows/hdl.yml
    with:
      working_directory: test/hdl
      test_command: "iverilog -g2005 -s simple_tb -o /tmp/simple.vvp simple.v simple_tb.v && vvp /tmp/simple.vvp"
      verilog_files: "simple.v"
      top: simple
